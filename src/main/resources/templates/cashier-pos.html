<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${pageTitle} + ' | FreshLedger POS'">New Bill | FreshLedger POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/design-system.css}" />
    <style>
        body{margin:0;background:#f3f7f5;font-family:'Plus Jakarta Sans',sans-serif;color:#11221a;}
        .pos-shell{display:grid;grid-template-columns:1.2fr 2.2fr 1.1fr;min-height:100vh;padding:18px;gap:18px;}
        .panel{background:#fff;border:1px solid #e4ebe6;border-radius:18px;padding:18px;box-shadow:0 12px 20px rgba(8,23,17,.03);}
        .search-box{width:100%;padding:14px 16px;border:1px solid #dfeae4;border-radius:12px;font-size:1rem;}
        .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
        .chip{border:none;border-radius:999px;padding:8px 12px;background:#edf5f2;color:#123f2e;font-weight:700;font-size:.8rem;}
        .product-list{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
        .product-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid #e2eae5;border-radius:14px;background:#fafcfb;}
        .pos-product-heading{display:flex;align-items:center;gap:9px;min-width:0;}
        .pos-product-image,.cart-product-image{width:40px;height:40px;flex:0 0 40px;object-fit:contain;border-radius:8px;background:#f4f7f5;padding:3px;}
        .btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;cursor:pointer;}
        .btn-primary{background:#0d5d3b;color:#fff;}
        .btn-secondary{background:#edf5f2;color:#143c2d;border:1px solid #dfeae4;}
        .cart-list{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
        .item{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid #e8efe9;border-radius:12px;}
        .totals{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
        .total-row{display:flex;justify-content:space-between;padding:6px 0;}
        .payment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;}
        .payment-btn{padding:14px;border-radius:12px;border:1px solid #dfeae4;background:#f3f8f5;font-weight:800;}
        @media (max-width: 1024px){.pos-shell{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<div class="pos-shell">
    <aside class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h2 style="margin:0;">Product Search</h2>
            <a href="/cashier/dashboard" style="color:#0d5d3b;font-weight:800;text-decoration:none;">← Back</a>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
            <button id="btnPosPhotoCart" class="btn btn-secondary" type="button" onclick="openPhotoCartModal()" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.85rem;padding:8px 12px;font-weight:700;">
                <span>📷</span><span>Photo Cart</span>
            </button>
            <button id="btnPosVoiceCart" class="btn btn-secondary" type="button" onclick="openVoiceBillingModal()" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.85rem;padding:8px 12px;font-weight:700;">
                <span>🎤</span><span>Voice Cart</span>
            </button>
        </div>
        <input id="posProductSearch" class="search-box" type="text" placeholder="Search by product name or barcode" aria-label="Search products" />
        <div class="chip-row category-filter-pills">
            <button class="chip pill-btn active" type="button">All Items</button>
            <button class="chip pill-btn" type="button">Dairy</button>
            <button class="chip pill-btn" type="button">Grocery</button>
            <button class="chip pill-btn" type="button">Bakery</button>
            <button class="chip pill-btn" type="button">Produce</button>
        </div>
        <div id="posProductGrid" class="product-list"></div>
    </aside>

    <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="margin:0;">Product Results</h2>
            <div style="font-size:.76rem;letter-spacing:.08em;color:#60756a;font-weight:800;">CATEGORY: ALL</div>
        </div>
        <div class="product-list">
            <div class="product-card"><div><strong>Browsing Catalog</strong><div style="color:#60756a;font-size:.82rem;">Live inventory loaded from store data</div></div><div style="font-weight:800;color:#0d5d3b;">Ready</div></div>
        </div>
    </section>

    <aside class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h2 style="margin:0;">Current Bill</h2>
            <button id="btnHeldBillsList" class="btn btn-secondary" type="button" style="padding:6px 10px;">
                Held (<span id="heldBillsCount">0</span>)
            </button>
        </div>

        <div style="margin-bottom:12px;">
            <label for="posCustomerSelect" style="display:block;font-size:.76rem;font-weight:700;color:#60756a;letter-spacing:.08em;margin-bottom:8px;">Customer</label>
            <select id="posCustomerSelect" class="search-box" style="padding:12px 14px;"></select>
        </div>

        <div id="posCartItems" class="cart-list"></div>

        <div class="totals">
            <div class="total-row"><span>Subtotal</span><strong id="posSubtotal">₹0.00</strong></div>
            <div class="total-row"><span>Discount</span><strong id="posDiscount">₹0.00</strong></div>
            <div class="total-row"><span>Tax</span><strong id="posTax">₹0.00</strong></div>
            <div class="total-row" style="font-size:1.2rem;"><span>Grand Total</span><strong id="posGrandTotal">₹0.00</strong></div>
        </div>

        <div class="payment-grid">
            <label class="payment-btn" style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="radio" name="payType" value="Cash" checked /> Cash</label>
            <label class="payment-btn" style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="radio" name="payType" value="UPI / PhonePe" /> UPI</label>
            <label class="payment-btn" style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="radio" name="payType" value="Card" /> Card</label>
            <label class="payment-btn" style="display:flex;align-items:center;justify-content:center;gap:6px;"><input type="radio" name="payType" value="Split Payment" /> Split</label>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px;">
            <button id="btnCompletePayment" class="btn btn-primary" type="button">Complete Sale</button>
            <button id="btnHoldBill" class="btn btn-secondary" type="button">Hold Bill</button>
            <button id="btnPrintInvoice" class="btn btn-secondary" type="button">Print Bill</button>
            <button id="btnSendPosWhatsApp" class="btn btn-secondary" type="button">WhatsApp</button>
            <button id="btnClearBill" class="btn btn-secondary" type="button">Clear Bill</button>
        </div>
    </aside>
</div>

<div th:replace="~{fragments/components :: upiModal}"></div>
<div th:replace="~{fragments/components :: whatsAppModal}"></div>
<div th:replace="~{fragments/components :: explainBillModal}"></div>
<div th:replace="~{fragments/components :: photoCartModal}"></div>
<div th:replace="~{fragments/components :: voiceBillingModal}"></div>

<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
