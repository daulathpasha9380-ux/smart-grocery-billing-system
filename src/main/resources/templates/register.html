<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | FreshLedger</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" />
</head>
<body>
<main class="login-shell">
    <section class="login-form-side">
        <h1 class="login-title">Create customer account</h1>
        <p class="login-subtitle">Register to shop and view your orders.</p>
        <div th:if="${registrationError}" class="badge badge-danger" th:text="${registrationError}"></div>
        <form th:action="@{/register}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" required minlength="3" maxlength="80" pattern="[A-Za-z0-9._-]+" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="displayName">Full name</label>
                <input class="form-control" id="displayName" name="displayName" required maxlength="160" autocomplete="name">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" name="email" required maxlength="254" autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-control" id="phone" name="phone" required maxlength="30" autocomplete="tel">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password (12 to 72 UTF-8 bytes)</label>
                    <input class="form-control" id="password" type="password" name="password" required minlength="12" maxlength="72" autocomplete="new-password">
            </div>
            <button class="btn btn-primary btn-full btn-lg" type="submit">Create account</button>
        </form>
        <p class="login-subtitle" style="margin-top:var(--space-md);"><a href="/login">Back to sign in</a></p>
    </section>
</main>
</body>
</html>
