<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Help | FreshLedger</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-app);
            padding: var(--space-md);
        }

        .help-card {
            width: min(480px, 100%);
            padding: var(--space-2xl);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            background: var(--bg-surface);
            box-shadow: var(--shadow-modal);
        }

        .help-card h1 {
            margin-bottom: var(--space-sm);
        }

        .help-card p {
            color: var(--text-muted);
            line-height: 1.6;
        }
    </style>
</head>
<body>
<main class="help-card">
    <h1>Password help</h1>
    <p>Enter the email address on your account. If it matches an account, we’ll send a password reset link.</p>
    <div th:if="${message}" class="badge badge-success" style="display:block;margin:var(--space-md) 0;padding:10px 12px;" th:text="${message}"></div>
    <div th:if="${error}" class="badge badge-danger" style="display:block;margin:var(--space-md) 0;padding:10px 12px;" th:text="${error}"></div>
    <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-group">
            <label class="form-label" for="email">Account email</label>
            <input class="form-control" id="email" type="email" name="email" required maxlength="254" autocomplete="email">
        </div>
        <button class="btn btn-primary btn-full" type="submit">Send reset link</button>
    </form>
    <p style="margin-top:var(--space-md);">Never share a reset link with anyone.</p>
    <a class="btn btn-primary" th:href="@{/login}" href="/login">Back to sign in</a>
</main>
</body>
</html>
