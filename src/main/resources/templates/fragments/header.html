<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="top-header">
    <div class="header-left">
        <button id="mobileNavToggle" class="mobile-nav-toggle" aria-label="Toggle navigation drawer">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div class="header-search">
            <span class="header-search-icon">🔍</span>
            <input type="text" placeholder="Search products, invoices, customers..." aria-label="Global Search">
        </div>
    </div>

    <div class="header-right">
        <div class="store-status-badge" id="offlineStatusBadge" style="cursor:pointer;" title="Click to test offline sync status mode">
            <span class="status-dot"></span>
            <span id="offlineStatusText">OFFLINE MODE</span>
        </div>
        <div class="store-status-badge" style="background:var(--primary-light);border-color:var(--primary-border);color:var(--primary-dark);">
            <span>Shift: Cashier 1 (Open)</span>
        </div>

        <div class="user-profile">
            <div class="user-avatar">👤</div>
            <div class="user-info">
                <span class="user-name" sec:authentication="name">Admin User</span>
                <span class="user-role" sec:authorize="hasRole('ROLE_OWNER')">Store Owner</span>
                <span class="user-role" sec:authorize="hasRole('ROLE_CASHIER')">Cashier</span>
            </div>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-signout">Sign out</button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
