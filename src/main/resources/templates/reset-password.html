<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FreshLedger</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-app);
            padding: var(--space-md);
        }

        .help-card {
            width: min(480px, 100%);
            padding: var(--space-2xl);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            background: var(--bg-surface);
            box-shadow: var(--shadow-modal);
        }

        .help-card h1 {
            margin-bottom: var(--space-sm);
        }
    </style>
</head>
<body>
<main class="help-card">
    <h1>Set a new password</h1>
    <p class="login-subtitle" th:text="'Choose a password between ' + ${minimumPasswordLength} + ' and 72 UTF-8 bytes.'">Choose a password between 12 and 72 UTF-8 bytes.</p>
    <div th:if="${error}" class="badge badge-danger" style="display:block;margin:var(--space-md) 0;padding:10px 12px;" th:text="${error}"></div>
    <form th:if="${validToken}" th:action="@{/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="token" th:value="${token}">
        <div class="form-group">
            <label class="form-label" for="password">New password</label>
            <input class="form-control" id="password" type="password" name="password" required th:attr="minlength=${minimumPasswordLength}" maxlength="72" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm new password</label>
            <input class="form-control" id="confirmPassword" type="password" name="confirmPassword" required th:attr="minlength=${minimumPasswordLength}" maxlength="72" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-full" type="submit">Update password</button>
    </form>
    <a class="btn btn-primary" th:href="@{/forgot-password}" href="/forgot-password">Request another link</a>
</main>
</body>
</html>
