spring.application.name=billing-system
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.product-images.directory=${user.home}/.freshledger/product-images
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:noreply@freshledger.local}
app.loyalty.points-per-100=${LOYALTY_POINTS_PER_100:1}
app.loyalty.value-per-point=${LOYALTY_VALUE_PER_POINT:1.00}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
