spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
server.servlet.session.cookie.secure=true

app.auth.bootstrap-owner-password=${APP_BOOTSTRAP_OWNER_PASSWORD:}
app.auth.bootstrap-owner-email=${APP_BOOTSTRAP_OWNER_EMAIL:}
app.migration.h2-to-postgres.enabled=false
app.migration.h2-to-postgres.source-url=${H2_MIGRATION_URL:}
app.migration.h2-to-postgres.source-username=${H2_MIGRATION_USERNAME:sa}
app.migration.h2-to-postgres.source-password=${H2_MIGRATION_PASSWORD:}
