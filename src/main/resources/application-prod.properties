server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.session.cookie.secure=true

# Database configuration: Supports DB_URL, JDBC_DATABASE_URL, DATABASE_URL, and SPRING_DATASOURCE_URL
spring.datasource.url=${DB_URL:${JDBC_DATABASE_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:}}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:${SPRING_DATASOURCE_USERNAME:}}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool resilience for Neon serverless PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000

# Flyway migrations
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Owner account bootstrapping
app.auth.bootstrap-owner-password=${APP_BOOTSTRAP_OWNER_PASSWORD:}
app.auth.bootstrap-owner-email=${APP_BOOTSTRAP_OWNER_EMAIL:}

# Optional one-time H2-to-PostgreSQL migration runner
app.migration.h2-to-postgres.enabled=false
app.migration.h2-to-postgres.source-url=${H2_MIGRATION_URL:}
app.migration.h2-to-postgres.source-username=${H2_MIGRATION_USERNAME:sa}
app.migration.h2-to-postgres.source-password=${H2_MIGRATION_PASSWORD:}
