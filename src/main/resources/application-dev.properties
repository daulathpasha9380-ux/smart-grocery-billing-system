spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.freshledger/billing;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.flyway.enabled=false
server.servlet.session.cookie.secure=false

app.auth.owner-password=${APP_AUTH_OWNER_PASSWORD:}
app.auth.cashier-password=${APP_AUTH_CASHIER_PASSWORD:}
app.auth.customer-password=${APP_AUTH_CUSTOMER_PASSWORD:}
app.auth.owner-email=${APP_AUTH_OWNER_EMAIL:}
app.auth.cashier-email=${APP_AUTH_CASHIER_EMAIL:}
